<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICEPICK / ATLAS</title>
<style>
:root{font-family:Tahoma,Verdana,sans-serif;font-size:12px;color:#171717}*{box-sizing:border-box}body{margin:0;background:#087c80;overflow:hidden}.desktop{height:calc(100vh - 34px);position:relative;background:radial-gradient(ellipse at 50% 30%,#188f90,#086568)}.taskbar{height:34px;background:#c0c0c0;border-top:2px solid #fff;display:flex;gap:5px;align-items:center;padding:3px;box-shadow:0 -1px #555}.taskbar button,button,select{font:inherit;background:#c0c0c0;border:2px outset #eee;padding:4px 8px;cursor:pointer;color:#111}.taskbar button:active,button:active{border-style:inset}.taskbar .clock{margin-left:auto;border:1px inset #fff;padding:5px}.window{position:absolute;background:#c0c0c0;border:2px outset #eee;box-shadow:2px 3px 0 #2227;min-width:300px;min-height:180px;display:flex;flex-direction:column;resize:both;overflow:hidden}.titlebar{background:linear-gradient(90deg,#081b65,#3478a9);color:white;font-weight:bold;padding:3px 4px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none}.titlebar button{padding:0;width:20px;height:19px;line-height:12px;font-weight:bold}.content{flex:1;overflow:auto;padding:8px}.panel{background:#e5e5e5;border:2px inset #fff;padding:8px;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:white;border:1px inset #999;padding:10px}.stat strong{display:block;color:#102b72;font-size:22px}.chartbox{height:calc(100% - 15px);min-height:230px}.small{color:#555;font-size:11px}input[type=file]{max-width:100%}progress{width:100%}table{border-collapse:collapse;width:100%;background:white}td,th{border:1px solid #999;padding:5px;text-align:left}th{background:#ddd}.desktop-icon{position:absolute;left:15px;color:white;text-align:center;width:88px;cursor:pointer;padding:7px}.desktop-icon span{display:block;font-size:32px;text-shadow:1px 2px #123}.desktop-icon:hover{background:#ffffff20}.notice{border-left:4px solid #9a7220;background:#fff6d8;padding:8px}.wincontrols{display:flex;gap:2px}.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.badge{background:#e0e0e0;border:1px solid #888;padding:2px 5px}.window[hidden]{display:none}.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none}
html,body{height:100%;height:100dvh}body{display:flex;flex-direction:column;min-height:0}.desktop{height:calc(100dvh - 42px)!important;flex:none!important;width:100%;overflow:hidden}.taskbar{position:fixed!important;bottom:0!important;left:0;right:0;width:100%;z-index:2147483000;height:42px!important;display:flex!important;align-items:center!important;padding:3px}#tasks{display:flex;gap:3px;overflow-x:auto;min-width:0;flex:1}#tasks button{flex:none;max-width:155px;overflow:hidden;text-overflow:ellipsis}#startButton{min-width:92px!important;background:#c0c0c0!important}
.name-item{padding:5px 8px;cursor:pointer;border-bottom:1px solid #ddd;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name-item:hover{background:#087c80;color:#fff}
.name-item.selected{background:#081b65;color:#fff;font-weight:bold}
.img-card{background:#fff;border:1px solid #999;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;text-decoration:none;color:#111;text-align:center}
.img-card:hover{background:#f0f8ff;border-color:#081b65}
</style></head><body>
<div class="desktop" id="desktop">
  <div class="desktop-icon" style="top:14px" onclick="showWindow('overview')"><span>▦</span>Overview</div>
  <div class="desktop-icon" style="top:108px" onclick="showWindow('media')"><span>🖼️</span>Image Viewer</div>
</div>
<div class="taskbar"><button id="startButton" onclick="toggleStartMenu()">▣ Start</button><span id="tasks" aria-label="Open windows"></span><span class="clock" id="clock">LOCAL / OFFLINE</span></div>
<div id="startMenu" hidden style="position:fixed;bottom:42px;left:2px;z-index:2147483001;background:#c0c0c0;border:2px outset white;padding:8px;min-width:210px;display:none"><strong>ICEPICK / ATLAS</strong><hr><div id="startMenuItems"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const desktop=document.getElementById('desktop'),tasks=document.getElementById('tasks');
let topZ=10,rows=[],opened=new Set(),orgNameMap={};
const specs=[
  ['overview','ATLAS — Overview',120,36,720,550],
  ['media','Organization Name & Google Image Viewer',150,50,840,580]
];

for(const [id,title,x,y,w,h] of specs){
  const el=document.createElement('section');el.className='window';el.id='w-'+id;el.hidden=true;
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++topZ}`;
  el.innerHTML=`<div class="titlebar"><span>▣ ${title}</span><span class="wincontrols"><button title="Minimize" data-act="min">_</button><button title="Maximize" data-act="max">□</button><button title="Close" data-act="close">×</button></span></div><div class="content" id="c-${id}"></div><div class="status" id="s-${id}">READY · NO ARCHIVE LOADED</div>`;
  desktop.appendChild(el);el.addEventListener('pointerdown',()=>focusWindow(id));
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.act==='max')el.classList.toggle('max');else el.hidden=true;renderTasks()});
  const bar=el.querySelector('.titlebar');
  bar.addEventListener('pointerdown',e=>{
    if(e.target.tagName==='BUTTON'||el.classList.contains('max'))return;
    let sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;bar.setPointerCapture(e.pointerId);
    const move=a=>{el.style.left=Math.max(0,ox+a.clientX-sx)+'px';el.style.top=Math.max(0,oy+a.clientY-sy)+'px'};
    bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',()=>bar.removeEventListener('pointermove',move),{once:true})
  });
  new ResizeObserver(()=>{if(!el.hidden)render(id)}).observe(el);
}

function focusWindow(id){document.getElementById('w-'+id).style.zIndex=++topZ}
function showWindow(id){const el=document.getElementById('w-'+id);el.hidden=false;opened.add(id);focusWindow(id);render(id);renderTasks()}
function renderTasks(){tasks.innerHTML='';for(const id of opened){const e=document.getElementById('w-'+id),b=document.createElement('button');b.textContent=specs.find(x=>x[0]===id)[1].split(' — ')[0];b.onclick=()=>showWindow(id);tasks.appendChild(b)}}
function transformDotToSpace(rawName){return String(rawName||'').replace(/\./g,' ');}

function render(id){
  const root=document.getElementById('c-'+id);if(!root)return;
  if(id==='overview'){
    root.innerHTML='';
    const panel=document.createElement('div');panel.className='panel';
    panel.innerHTML=`<b>FILE / IMPORT ARCHIVE</b><p><input type="file" id="zipfile" accept=".zip,application/zip"></p><progress id="progress" value="${rows.length>0?100:0}" max="100"></progress><p id="progressText" class="small">${rows.length>0?'Archive loaded: '+rows.length.toLocaleString()+' records ready.':'Choose a local ZIP file. Nothing is transmitted.'}</p>`;
    root.appendChild(panel);
    root.querySelector('#zipfile').onchange=e=>loadZip(e.target.files[0]);
  }
  else if(id==='media'){
    root.innerHTML='';
    const container=document.createElement('div');
    container.style.cssText="display:flex;gap:8px;height:100%";
    
    const leftPane=document.createElement('div');
    leftPane.style.cssText="width:280px;display:flex;flex-direction:column;gap:6px;border-right:2px inset #fff;padding-right:8px";
    
    const orgs=Object.keys(orgNameMap).sort();
    leftPane.innerHTML=`
      <label><b>Organization</b>
        <select id="mediaOrgSelect" style="width:100%;margin-top:2px">
          <option value="">-- Select Org (${orgs.length}) --</option>
          ${orgs.map(o=>`<option value="${o}"${orgs.length===1?' selected':''}>${o} (${orgNameMap[o].length})</option>`).join('')}
        </select>
      </label>
      <input type="text" id="mediaFilter" placeholder="Filter names..." style="width:100%">
      <div id="mediaList" style="flex:1;overflow-y:auto;background:white;border:2px inset #eee"></div>
    `;

    const rightPane=document.createElement('div');
    rightPane.style.cssText="flex:1;display:flex;flex-direction:column;gap:6px";
    rightPane.innerHTML=`
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <b>Raw:</b> <span id="mediaRaw" style="font-family:monospace;background:#eee;padding:2px 4px">None</span>
        <span>➔</span>
        <b>Query:</b> <span id="mediaTransformed" style="font-family:monospace;background:#fff;padding:2px 4px;color:#081b65">None</span>
        <button id="mediaGoogleBtn" style="margin-left:auto;background:#081b65;color:white;font-weight:bold">Open Google Images ↗</button>
      </div>
      <p class="small" style="margin:0">Showing the first 10 Google Image results for <code style="background:#ddd">word1.word2</code> transformed to spaces (<code style="background:#ddd">word1 word2</code>).</p>
      <div id="mediaImgGrid" style="flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow-y:auto;background:#071826;padding:6px;border:2px inset #eee">
        <div style="color:#fff;grid-column:span 5;text-align:center;padding-top:40px">Select an organization and entry from the scrollable list on the left.</div>
      </div>
    `;

    container.appendChild(leftPane);
    container.appendChild(rightPane);
    root.appendChild(container);

    const orgSelect=root.querySelector('#mediaOrgSelect');
    const filterInput=root.querySelector('#mediaFilter');
    const mediaList=root.querySelector('#mediaList');
    const rawSpan=root.querySelector('#mediaRaw');
    const transformedSpan=root.querySelector('#mediaTransformed');
    const googleBtn=root.querySelector('#mediaGoogleBtn');
    const imgGrid=root.querySelector('#mediaImgGrid');

    let currentOrg=orgs.length===1?orgs[0]:'';
    let selectedRawName='';

    const updateMediaList=()=>{
      mediaList.innerHTML='';
      if(!currentOrg||!orgNameMap[currentOrg])return;
      const term=filterInput.value.toLowerCase();
      const list=orgNameMap[currentOrg].filter(n=>n.toLowerCase().includes(term));
      
      list.slice(0,1500).forEach(raw=>{
        const item=document.createElement('div');
        item.className='name-item'+(raw===selectedRawName?' selected':'');
        item.textContent=raw;
        item.onclick=()=>{
          selectedRawName=raw;
          root.querySelectorAll('.name-item').forEach(e=>e.classList.remove('selected'));
          item.classList.add('selected');
          
          const transformed=transformDotToSpace(raw);
          rawSpan.textContent=raw;
          transformedSpan.textContent=transformed;
          
          const searchUrl=`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(transformed)}`;
          googleBtn.onclick=()=>window.open(searchUrl,'_blank');

          imgGrid.innerHTML='';
          for(let i=1;i<=10;i++){
            const card=document.createElement('a');
            card.className='img-card';
            card.href=searchUrl;
            card.target='_blank';
            card.innerHTML=`<div style="font-size:22px;color:#081b65;margin-top:10px">🖼️</div><span>Result #${i}</span><span style="font-weight:bold;color:#056">${transformed}</span>`;
            imgGrid.appendChild(card);
          }
        };
        mediaList.appendChild(item);
      });
    };

    orgSelect.onchange=(e)=>{currentOrg=e.target.value;updateMediaList();};
    filterInput.oninput=updateMediaList;
    if(currentOrg)updateMediaList();
  }
  document.getElementById('s-'+id).textContent=`${rows.length.toLocaleString()} RECORDS · LOCAL / OFFLINE`;
}

async function loadZip(file){
  if(!file||importBusy)return;importBusy=true;
  const progress=document.getElementById('progress'),label=document.getElementById('progressText');
  try{
    label.textContent='Unpacking archive...';
    const zip=await JSZip.loadAsync(file);
    const entries=Object.values(zip.files).filter(e=>!e.dir);
    
    let processed=0;
    const rowsOut=[];
    const orgNames={};

    for(const entry of entries){
      processed++;
      if(progress)progress.value=(processed/entries.length)*100;
      if(label)label.textContent=`Processing entry ${processed} / ${entries.length}`;

      let parts=entry.name.split('/');
      let fileNameWithExt=parts.pop()||'';
      let rawName=fileNameWithExt.replace(/\.[^/.]+$/, '');
      
      let comp=(parts.length>0?parts[parts.length-1]:'GENERAL').toUpperCase();
      if(comp==='ASSOCIATES'&&parts.length>1) comp=parts[parts.length-2].toUpperCase();

      if(!orgNames[comp]) orgNames[comp]=[];
      orgNames[comp].push(rawName);
      rowsOut.push({component:comp});
    }

    for(const o in orgNames){
      orgNames[o].sort((a,b)=>a.localeCompare(b));
    }

    rows=rowsOut;
    orgNameMap=orgNames;
    if(progress)progress.value=100;
    label.textContent=`Successfully loaded ${rows.length.toLocaleString()} entries across ${Object.keys(orgNameMap).length} organizations!`;
    
    showWindow('media');
  }catch(e){
    if(label)label.textContent='Import failed: '+e.message;
  }
  importBusy=false;
}

function renderAll(){for(const v of opened)if(!document.getElementById('w-'+v).hidden)render(v)}
function toggleStartMenu(){const m=document.getElementById('startMenu');m.hidden=!m.hidden;m.style.display=m.hidden?'none':'block';}
showWindow('overview');
</script></body></html>
