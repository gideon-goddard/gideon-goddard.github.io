<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICEPICK / ATLAS v2</title>
<style>
:root{font-family:Tahoma,Verdana,sans-serif;font-size:12px;color:#171717}*{box-sizing:border-box}body{margin:0;background:#087c80;overflow:hidden}.desktop{height:calc(100vh - 34px);position:relative;background:radial-gradient(ellipse at 50% 30%,#188f90,#086568)}.taskbar{height:34px;background:#c0c0c0;border-top:2px solid #fff;display:flex;gap:5px;align-items:center;padding:3px;box-shadow:0 -1px #555}.taskbar button,button,select{font:inherit;background:#c0c0c0;border:2px outset #eee;padding:4px 8px;cursor:pointer;color:#111}.taskbar button:active,button:active{border-style:inset}.taskbar .clock{margin-left:auto;border:1px inset #fff;padding:5px}.window{position:absolute;background:#c0c0c0;border:2px outset #eee;box-shadow:2px 3px 0 #2227;min-width:300px;min-height:180px;display:flex;flex-direction:column;resize:both;overflow:hidden}.titlebar{background:linear-gradient(90deg,#081b65,#3478a9);color:white;font-weight:bold;padding:3px 4px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none}.titlebar button{padding:0;width:20px;height:19px;line-height:12px;font-weight:bold}.content{flex:1;overflow:auto;padding:8px}.menu{padding:5px;border-bottom:1px solid #888;display:flex;gap:6px;flex-wrap:wrap}.status{padding:4px;border-top:1px solid #888;background:#d1d1d1;font-size:11px}.canvas{background:#071826;border:2px inset #eee;width:100%;height:100%;min-height:220px;display:block}.panel{background:#e5e5e5;border:2px inset #fff;padding:8px;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:white;border:1px inset #999;padding:10px}.stat strong{display:block;color:#102b72;font-size:22px}.chartbox{height:calc(100% - 15px);min-height:230px}.small{color:#555;font-size:11px}input[type=file],input[type=text]{max-width:100%}progress{width:100%}table{border-collapse:collapse;width:100%;background:white}td,th{border:1px solid #999;padding:5px;text-align:left}th{background:#ddd}.desktop-icon{position:absolute;left:15px;color:white;text-align:center;width:88px;cursor:pointer;padding:7px}.desktop-icon span{display:block;font-size:32px;text-shadow:1px 2px #123}.desktop-icon:hover{background:#ffffff20}.notice{border-left:4px solid #9a7220;background:#fff6d8;padding:8px}.wincontrols{display:flex;gap:2px}.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.badge{background:#e0e0e0;border:1px solid #888;padding:2px 5px}.window[hidden]{display:none}.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none}.help{line-height:1.6}canvas{touch-action:none}
html,body{height:100%;height:100dvh}body{display:flex;flex-direction:column;min-height:0}.desktop{height:auto!important;flex:1;min-height:0;overflow:hidden}.taskbar{height:42px;min-height:42px;flex:none;position:relative;z-index:2147483000;overflow-x:auto;white-space:nowrap}.taskbar>button:first-child{flex:none;font-weight:bold;min-width:90px;background:#c0c0c0;border:2px outset white}.taskbar .clock{flex:none}.window{max-width:100vw;max-height:calc(100% - 5px)}@media(max-width:700px){.window{left:4px!important;top:5px!important;width:calc(100% - 8px)!important;height:calc(100% - 10px)!important;resize:none}.desktop-icon{display:none}.taskbar{gap:2px}.taskbar button{padding:5px}}
.taskbar{position:fixed!important;bottom:0!important;left:0;right:0;width:100%;z-index:2147483000;overflow:hidden!important}.desktop{height:calc(100dvh - 42px)!important;flex:none!important;width:100%;overflow:hidden}#tasks{display:flex;gap:3px;overflow-x:auto;min-width:0;flex:1}#tasks button{flex:none;max-width:155px;overflow:hidden;text-overflow:ellipsis}#startButton{display:inline-flex!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:2147483002;min-width:92px!important;flex:none!important}@media(max-width:700px){.taskbar .clock{display:none}.window{max-height:calc(100dvh - 46px)}}#tasks{display:flex;gap:3px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:thin}#tasks button{flex:0 0 auto;max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#startButton{position:sticky!important;left:0!important;order:-1!important;flex-shrink:0!important;background:#c0c0c0!important;color:#111!important}.taskbar{display:flex!important;align-items:center!important;bottom:0!important;height:44px!important;min-height:44px!important}.desktop{padding-bottom:44px!important}#startMenu:not([hidden]){display:block!important}#startMenu[hidden]{display:none!important}@media(max-width:700px){#tasks button{max-width:92px}.taskbar{padding:2px!important}#startButton{min-width:80px!important}}

.name-item{padding:4px 6px;cursor:pointer;border-bottom:1px solid #ddd;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name-item:hover{background:#087c80;color:#fff}.name-item.selected{background:#081b65;color:#fff;font-weight:bold}.img-card{background:#fff;border:1px solid #999;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;overflow:hidden;text-align:center}.img-card img{max-width:100%;max-height:85px;object-fit:contain}.img-card span{font-size:10px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
</style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="desktop-icon" style="top:14px" onclick="showWindow('overview')"><span>▦</span>Overview</div>
  <div class="desktop-icon" style="top:108px" onclick="showWindow('appfinder')"><span>🔍</span>App Search</div>
  <div class="desktop-icon" style="top:202px" onclick="showWindow('anatomy')"><span>▤</span>Organizations</div>
  <div class="desktop-icon" style="top:296px" onclick="showWindow('flows')"><span>⇄</span>Membership</div>
</div>

<div class="taskbar">
  <button id="startButton" onclick="toggleStartMenu()">▣ Start</button>
  <span id="tasks" aria-label="Open windows"></span>
  <span class="clock" id="clock">LOCAL / OFFLINE</span>
</div>

<div id="startMenu" hidden style="position:fixed;bottom:42px;left:2px;z-index:2147483001;background:#c0c0c0;border:2px outset white;padding:8px;min-width:210px;box-shadow:3px 3px #333;display:none">
  <strong>ICEPICK / ATLAS</strong><hr><div id="startMenuItems"></div>
</div>

<script>
const desktop=document.getElementById('desktop'),tasks=document.getElementById('tasks');
let topZ=10,rows=[],meta={},filters={component:'ALL',min:0,max:9999},aggregate=null,opened=new Set(),importBusy=false;
let orgNameMap = {}; 

const colors=['#70d8c7','#e8bb72','#a7a3ef','#ec8c92','#87b9e9','#b9d47c','#dfb0db'];
const specs=[
  ['overview','ATLAS — Overview',120,36,720,550],
  ['appfinder','Organization App & Profile Image Finder',150,45,820,560],
  ['universe','01 — Component Bubble Chart',170,55,730,500],
  ['anatomy','02 — Organization Breakdown',210,72,700,490],
  ['flows','03 — Membership Category Bars',250,89,700,490],
  ['sankey','04 — Organization → Category Sankey',275,98,810,560],
  ['members','Organization Member Breakdown (Aggregate)',290,105,760,540],
  ['media','Local Image Gallery',380,150,580,430],
  ['integrity','Data Integrity',400,165,630,450]
];

for(const [id,title,x,y,w,h] of specs){
  const el=document.createElement('section');el.className='window';el.id='w-'+id;el.hidden=true;
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++topZ}`;
  el.innerHTML=`<div class="titlebar"><span>▣ ${title}</span><span class="wincontrols"><button title="Minimize" data-act="min">_</button><button title="Maximize" data-act="max">□</button><button title="Close" data-act="close">×</button></span></div><div class="content" id="c-${id}"></div><div class="status" id="s-${id}">READY · NO ARCHIVE LOADED</div>`;
  desktop.appendChild(el);el.addEventListener('pointerdown',()=>focusWindow(id));
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.act==='max')el.classList.toggle('max');else el.hidden=true;renderTasks()});
  const bar=el.querySelector('.titlebar');
  bar.addEventListener('pointerdown',e=>{
    if(e.target.tagName==='BUTTON'||el.classList.contains('max'))return;
    let sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;bar.setPointerCapture(e.pointerId);
    const move=a=>{el.style.left=Math.max(0,ox+a.clientX-sx)+'px';el.style.top=Math.max(0,oy+a.clientY-sy)+'px'};
    bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',()=>bar.removeEventListener('pointermove',move),{once:true})
  });
  new ResizeObserver(()=>{if(!el.hidden)render(id)}).observe(el);
}

const CAT_LABELS=['Productivity / collaboration','Endpoint / device management','Network / connectivity','Identity / directory','Business applications','Other / unclassified'];
function classifyGroup(g){const v=String(g).toLowerCase();if(/office365|o365|exchange|outlook|teams|sharepoint|email/.test(v))return 0;if(/workstation|desktop|device|mobile|printer|endpoint|intune/.test(v))return 1;if(/network|vpn|wifi|wireless|zscaler|proxy/.test(v))return 2;if(/identity|directory|piv|credential|authentication|ldap/.test(v))return 3;if(/application|app-|software|license|entitlement/.test(v))return 4;return 5}
function focusWindow(id){document.getElementById('w-'+id).style.zIndex=++topZ}
function showWindow(id){const el=document.getElementById('w-'+id);el.hidden=false;opened.add(id);focusWindow(id);render(id);renderTasks()}
function renderTasks(){tasks.innerHTML='';for(const id of opened){const e=document.getElementById('w-'+id),b=document.createElement('button');b.textContent=specs.find(x=>x[0]===id)[1].split(' — ')[0];b.onclick=()=>showWindow(id);tasks.appendChild(b)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filtered(){return rows.filter(r=>(filters.component==='ALL'||r.component===filters.component)&&r.groups>=filters.min&&r.groups<=filters.max&&(filters.category==='ALL'||(r.cats?.[Number(filters.category)]||0)>0))}
function summarize(data){let components={},counts=[],months={},missing=0;for(const r of data){components[r.component]=(components[r.component]||0)+1;counts.push(r.groups);if(!r.hasPivDate)missing++;if(r.month)months[r.month]=(months[r.month]||0)+1}counts.sort((a,b)=>a-b);return {components,counts,months,missing,n:data.length,mean:counts.reduce((a,b)=>a+b,0)/(counts.length||1),median:counts[Math.floor(counts.length/2)]||0,max:counts.at(-1)||0}}

function transformDotToSpace(rawName){
  return String(rawName||'').replace(/\./g, ' ');
}

function render(id){
  const root=document.getElementById('c-'+id);if(!root)return;
  const s=summarize(filtered());
  
  if(id==='overview'){
    root.innerHTML=`<div class="panel"><b>FILE / IMPORT ARCHIVE</b><p><input type="file" id="zipfile" accept=".zip,application/zip"></p><progress id="progress" value="0" max="100"></progress> <button id="cancelImport">Cancel import</button><p id="progressText" class="small">Choose a local ZIP file. Nothing is transmitted.</p></div><div class="stats"><div class="stat"><strong>${s.n.toLocaleString()}</strong>Records</div><div class="stat"><strong>${s.mean.toFixed(1)}</strong>Mean memberships</div><div class="stat"><strong>${Object.keys(s.components).length}</strong>Components</div></div><p class="notice">Privacy mode: aggregate-only analysis.</p><div class="panel"><b>WORKSPACES</b><p>${specs.map(x=>`<button data-open="${x[0]}">${x[1]}</button>`).join(' ')}</p></div>`;
    root.querySelector('#zipfile').onchange=e=>loadZip(e.target.files[0]);
    root.querySelector('#cancelImport').onclick=cancelImport;
    root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showWindow(b.dataset.open));
  }
  else if(id==='appfinder'){
    const orgs = Object.keys(orgNameMap).sort();
    root.innerHTML = `
      <div style="display:flex;gap:8px;height:100%">
        <div style="width:260px;display:flex;flex-direction:column;gap:6px;border-right:2px inset #fff;padding-right:8px">
          <label><b>Organization</b> 
            <select id="appOrgSelect" style="width:100%;margin-top:2px">
              <option value="">-- Select Org (${orgs.length}) --</option>
              ${orgs.map(o=>`<option value="${esc(o)}">${esc(o)} (${orgNameMap[o].length})</option>`).join('')}
            </select>
          </label>
          <input type="text" id="appSearchFilter" placeholder="Filter names..." style="width:100%">
          <div id="appList" style="flex:1;overflow-y:auto;background:white;border:2px inset #eee"></div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;gap:6px;align-items:center">
            <b>Selected Target:</b> <span id="appSelectedRaw" style="font-family:monospace;background:#eee;padding:2px 4px">None</span>
            <span>➔</span>
            <b>Query:</b> <span id="appSelectedTransformed" style="font-family:monospace;background:#fff;padding:2px 4px;color:#081b65">None</span>
            <button id="btnSearchGoogle" style="margin-left:auto">Open in Google Images ↗</button>
          </div>
          <p class="small" style="margin:0">Shows 10 Google Image results for the extracted <code style="background:#ddd">word1.word2</code> transformed to spaces (<code style="background:#ddd">word1 word2</code>).</p>
          <div id="appImgGrid" style="flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow-y:auto;background:#071826;padding:6px;border:2px inset #eee">
            <div style="color:#fff;grid-column:span 5;text-align:center;padding-top:40px">Select an organization and entry to load Google Image results.</div>
          </div>
        </div>
      </div>
    `;

    const orgSelect = root.querySelector('#appOrgSelect');
    const filterInput = root.querySelector('#appSearchFilter');
    const appList = root.querySelector('#appList');
    const appSelectedRaw = root.querySelector('#appSelectedRaw');
    const appSelectedTransformed = root.querySelector('#appSelectedTransformed');
    const btnSearchGoogle = root.querySelector('#btnSearchGoogle');
    const imgGrid = root.querySelector('#appImgGrid');

    let currentOrg = '';
    let selectedName = '';

    const updateList = () => {
      appList.innerHTML = '';
      if(!currentOrg || !orgNameMap[currentOrg]) return;
      const term = filterInput.value.toLowerCase();
      const list = orgNameMap[currentOrg].filter(n => n.toLowerCase().includes(term));
      
      list.slice(0, 1000).forEach(raw => {
        const item = document.createElement('div');
        item.className = 'name-item' + (raw === selectedName ? ' selected' : '');
        item.textContent = raw;
        item.title = raw + ' ➔ ' + transformDotToSpace(raw);
        item.onclick = () => {
          selectedName = raw;
          root.querySelectorAll('.name-item').forEach(e => e.classList.remove('selected'));
          item.classList.add('selected');
          triggerSearch(raw);
        };
        appList.appendChild(item);
      });
    };

    const triggerSearch = (raw) => {
      const transformed = transformDotToSpace(raw);
      appSelectedRaw.textContent = raw;
      appSelectedTransformed.textContent = transformed;
      
      btnSearchGoogle.onclick = () => {
        window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(transformed)}`, '_blank');
      };

      imgGrid.innerHTML = '';
      for(let i=1; i<=10; i++){
        const card = document.createElement('div');
        card.className = 'img-card';
        card.innerHTML = `
          <img src="https://source.unsplash.com/featured/160x120/?${encodeURIComponent(transformed)}&sig=${i}" 
               onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(transformed)}'" alt="${esc(transformed)}">
          <span>Result #${i}: ${esc(transformed)}</span>
        `;
        imgGrid.appendChild(card);
      }
    };

    orgSelect.onchange = (e) => { currentOrg = e.target.value; updateList(); };
    filterInput.oninput = updateList;
  }
}

function makeImportWorker(){
const code=String.raw`
const CAT=[/office365|o365|exchange|outlook|teams|sharepoint|email/,/workstation|desktop|device|mobile|printer|endpoint|intune/,/network|vpn|wifi|wireless|zscaler|proxy/,/identity|directory|piv|credential|authentication|ldap/,/application|app-|software|license|entitlement/];
function classify(g){let s=String(g).toLowerCase();for(let i=0;i<CAT.length;i++)if(CAT[i].test(s))return i;return 5}
self.onmessage=async e=>{try{
const file=e.data;
const zip=await JSZip.loadAsync(file,{checkCRC32:false});
const all=Object.values(zip.files),entries=all.filter(e=>!e.dir);
let valid=0,processed=0;const out=[];const orgNames={};
for(const entry of entries){processed++;
if(!/^dhs\/(?:associates\/)?(?:cbp|ice|uscis|hsi|hq|cisa|fps|fletc|sandt|s-t|tsa|fema|uscg|usss)\//i.test(entry.name)) continue;
try{
  const parts=entry.name.split('/');
  const comp=(parts[1]==='associates'?parts[2]:parts[1]||'UNKNOWN').toUpperCase();
  const rawFileName=parts.pop().replace(/\.json$/i,'');
  
  if(!orgNames[comp]) orgNames[comp] = [];
  orgNames[comp].push(rawFileName);

  const obj=JSON.parse(await entry.async('string'));
  const p=obj.profile_properties||obj.profileProperties||obj;
  const memberships=Array.isArray(p.actualMemberOf)?p.actualMemberOf:Array.isArray(p.memberOf)?p.memberOf:[];
  const cats=[0,0,0,0,0,0];for(const g of memberships)cats[classify(g)]++;
  out.push({component:comp,groups:memberships.length,cats,hasPivDate:!!p.pivExceptDate});valid++;
}catch{}
if(processed%200===0)self.postMessage({type:'progress',processed,total:entries.length});
}
self.postMessage({type:'complete',rows:out,orgNames})
}catch(err){self.postMessage({type:'error',message:String(err.message||err)})}};
`;
return new Worker(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
}

async function loadZip(file){
  if(!file||importBusy)return;importBusy=true;
  const progress=document.getElementById('progress'),label=document.getElementById('progressText');
  try{
    label.textContent='Loading archive into worker…';
    const worker=makeImportWorker();
    worker.onmessage=e=>{
      const msg=e.data;
      if(msg.type==='progress'){if(progress)progress.value=msg.processed/msg.total*100;return}
      if(msg.type==='complete'){
        rows=msg.rows;
        orgNameMap=msg.orgNames||{};
        aggregate=summarize(rows);
        render('overview');
        showWindow('appfinder');
      }
      importBusy=false;
    };
    const buffer=await file.arrayBuffer();
    worker.postMessage(buffer,[buffer]);
  }catch(e){importBusy=false}
}

function cancelImport(){importBusy=false}
function toggleStartMenu(){const m=document.getElementById('startMenu');m.hidden=!m.hidden;m.style.display=m.hidden?'none':'block'}
showWindow('overview');
</script>
</body>
</html>
